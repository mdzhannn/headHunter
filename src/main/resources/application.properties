spring.datasource.url=jdbc:postgresql://localhost:5433/headhunter
spring.datasource.username=postgres
spring.datasource.password=021207
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=always
server.error.include-binding-errors=always
server.port=${PORT:8080}
spring.main.allow-circular-references=true

# CORS: comma-separated patterns. Production on Render: set APP_CORS_ALLOWED_ORIGIN_PATTERNS if you use a custom domain.
app.cors.allowed-origin-patterns=http://localhost:*,http://127.0.0.1:*,https://*.vercel.app

# Candidate OTP / JWT
app.auth.jwt-secret=${APP_AUTH_JWT_SECRET:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef}
app.auth.jwt-expiration-ms=86400000
app.auth.otp-ttl-minutes=5
app.auth.otp-rate-window-minutes=10
app.auth.otp-max-sends-per-window=3
app.auth.otp-max-verify-attempts-per-challenge=5

# Mail provider: "smtp" (local Gmail) or "resend" (HTTPS API, works on Render free)
app.mail.provider=${APP_MAIL_PROVIDER:smtp}
app.mail.from=${APP_MAIL_FROM:${MAIL_USERNAME:}}

# Resend (used when app.mail.provider=resend)
app.mail.resend.api-key=${APP_MAIL_RESEND_API_KEY:}
app.mail.resend.endpoint=${APP_MAIL_RESEND_ENDPOINT:https://api.resend.com/emails}

# Gmail SMTP (used when app.mail.provider=smtp)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.properties.mail.debug=${MAIL_DEBUG:false}

logging.level.resume.vakansya.auth=DEBUG
logging.level.resume.vakansya.mail=DEBUG
logging.level.org.springframework.mail=DEBUG
